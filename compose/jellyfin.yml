services:
  # Jellyfin - Media Server
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    networks:
      media_network:
          ipv4_address: ${JELLYFIN_IP}
    security_opt:
      - no-new-privileges:true
    restart: "no"
    # profiles: ["media", "all"]
    user: $PUID:$PGID
    devices:
      - /dev/dri:/dev/dri # for harware transcoding
    ports:
      - "${JELLYFIN_PORT}:8096"
      # - "8920:8920" # Emby also uses same port if running both
    environment:
      UMASK_SET: 022
      TZ: $TZ
    volumes:
      - $DOCKERDIR/appdata/jellyfin:/config
      - $DATADIR/media:/data
      - type: bind
        source: ${MOVIES_DIR:?Run configure_storage.sh first}
        target: /data/movies
        bind:
          create_host_path: false
      - type: bind
        source: ${TV_DIR:?Run configure_storage.sh first}
        target: /data/tv
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOADS_DIR:?Run configure_storage.sh first}
        target: /t_downloads
        bind:
          create_host_path: false
      # - $DATADIR/usenet:/u_downloads
      - $TRANSCODE:/transcode
