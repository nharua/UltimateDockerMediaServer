services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      media_network:
        ipv4_address: ${SONARR_IP}
    ports:
      - "${SONARR_PORT}:8989"
    volumes:
      - $DOCKERDIR/appdata/sonarr:/config
      - type: bind
        source: ${TV_DIR:?Run configure_storage.sh first}
        target: /data/tv
        bind:
          create_host_path: false
      - type: bind
        source: ${DOWNLOADS_DIR:?Run configure_storage.sh first}
        target: /data/downloads
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: "002"

