services:
  # Bazarr+ - Subtitle Management
  # Guide: https://lavx.github.io/bazarr/guides/getting-started.html
  bazarr:
    image: ghcr.io/lavx/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    networks:
      media_network:
        ipv4_address: ${BAZARR_IP}
    ports:
      - "${BAZARR_PORT}:6767"
    volumes:
      - $DOCKERDIR/appdata/bazarr:/config
      - type: bind
        source: ${MOVIES_DIR:?Run configure_storage.sh first}
        target: /data/movies
        bind:
          create_host_path: false
      - type: bind
        source: ${TV_DIR:?Run configure_storage.sh first}
        target: /data/tv
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    # Container hardening recommended by Bazarr+
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6767/_supervisor/status | grep -q '\"running\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # AI Subtitle Translator (Optional - AI subtitle translation via OpenRouter)
  # Configure API key in Bazarr+: Settings > AI Translator
  # ai-subtitle-translator:
  #   image: ghcr.io/lavx/ai-subtitle-translator:latest
