services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest 
    container_name: radarr
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      media_network:
        ipv4_address: ${RADARR_IP}
    ports:
      - "${RADARR_PORT}:7878"
    volumes:
      - $DOCKERDIR/appdata/radarr:/config
      
      # Movie library (where Radarr moves movies after download)
      - $DATADIR/media/movies:/data/movies
      
      # Download folder from download clients (must match path in qBittorrent/SABnzbd)
      - $DATADIR/downloads:/data/downloads
      
      # Option: sync host system timezone
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK_SET: 002

