services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest 
    container_name: radarr
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      media_network:
        ipv4_address: ${RADARR_IP}
    ports:
      - "${RADARR_PORT}:7878"
    volumes:
      - $DOCKERDIR/appdata/radarr:/config
      
      # Movie library (where Radarr moves movies after download)
      - type: bind
        source: ${MOVIES_DIR:?Run configure_storage.sh first}
        target: /data/movies
        bind:
          create_host_path: false
      
      # Download folder from download clients (must match path in qBittorrent/SABnzbd)
      - type: bind
        source: ${DOWNLOADS_DIR:?Run configure_storage.sh first}
        target: /data/downloads
        bind:
          create_host_path: false
      
      # Option: sync host system timezone
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      UMASK: "002"

